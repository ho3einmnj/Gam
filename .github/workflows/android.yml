name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # استخراج و آماده‌سازی ایمن فایل‌ها
      - name: Prepare Web Assets
        run: |
          rm -rf www temp_unzip
          mkdir -p www

          # ۱. اگر فایل زیپ در مخزن وجود دارد
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -q -o *.zip -d temp_unzip
            HTML_FILE=$(find temp_unzip -iname "index.html" | head -n 1)
            
            if [ -n "$HTML_FILE" ]; then
              HTML_DIR=$(dirname "$HTML_FILE")
              cp -r "$HTML_DIR"/* www/
            else
              echo "خطا: فایل index.html درون فایل زیپ یافت نشد!"
              exit 1
            fi
            rm -rf temp_unzip

          # ۲. اگر فایل index.html مستقیماً در صفحه اصلی مخزن قرار دارد
          elif [ -f index.html ] || [ -f Index.html ]; then
            cp [iI]ndex.html www/index.html
            cp *.css *.js *.ttf *.otf www/ 2>/dev/null || true
          else
            echo "خطا: هیچ فایل وب یا زیپی در مخزن پیدا نشد!"
            exit 1
          fi

      - name: Initialize Capacitor & Android Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "ClassicalGuitar" "com.guitar.classical" --web-dir www
          npx cap add android

          # یکدست‌سازی نسخه‌های کاتلین
          cat << 'EOF' >> android/app/build.gradle

          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
          }

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Classical-Guitar-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
