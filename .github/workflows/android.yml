name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # انتقال ایمن فایل‌ها بدون ایجاد لوپ در پوشه www
      - name: Prepare Web Assets
        run: |
          mkdir -p staging_dir
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip -d temp_unzip
            if [ -f temp_unzip/index.html ]; then
              cp -r temp_unzip/* staging_dir/
            else
              SOURCE_DIR=$(find temp_unzip -name "index.html" -exec dirname {} \; | head -n 1)
              cp -r "$SOURCE_DIR"/* staging_dir/
            fi
            rm -rf temp_unzip
          elif [ -f index.html ]; then
            cp index.html staging_dir/
            cp -r *.css *.js *.ttf *.otf staging_dir/ 2>/dev/null || true
          fi
          rm -rf www
          mv staging_dir www

      - name: Initialize Capacitor & Android Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "ClassicalGuitar" "com.guitar.classical" --web-dir www
          npx cap add android

          # یکدست‌سازی نسخه‌های کاتلین
          cat << 'EOF' >> android/app/build.gradle

          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
          }

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Classical-Guitar-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
